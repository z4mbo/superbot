name: desktop-macos-screenshot
on:
  push:
    branches: [main]
    paths: &desktop-setup-paths
      - ".github/workflows/desktop-macos-screenshot.yml"
      - "apps/desktop/e2e/setup.spec.ts"
      - "apps/desktop/package.json"
      - "apps/desktop/assets/**"
      - "packages/ui-tokens/assets/**"
      - "apps/desktop/scripts/copy-static.mjs"
      - "apps/desktop/src/setup-renderer/**"
      - "apps/desktop/src/main/setup/**"
      - "apps/desktop/src/preload/setup*"
      - "apps/desktop/src/main/windows/window-options.ts"
      - "packages/contracts/src/clients/desktop.ts"
  pull_request:
    paths: *desktop-setup-paths

permissions:
  contents: read

concurrency:
  group: desktop-macos-screenshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screenshot:
    name: macOS setup screenshot
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @rakazo/desktop build
      # The bundle name and the icon's layers come from the packaging config, not from this file.
      - name: Verify packaged Tahoe icon and legacy fallback
        run: |
          pnpm --filter @rakazo/web build
          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm --filter @rakazo/desktop exec electron-builder --mac --dir --publish never -c.mac.identity=null -c.mac.notarize=false
          product="$(jq -r .productName apps/desktop/package.json)"
          icon="apps/desktop/$(jq -r .build.mac.icon apps/desktop/package.json)/icon.json"
          app="apps/desktop/out/mac-arm64/$product.app"
          xcrun assetutil --info "$app/Contents/Resources/Assets.car" > "$RUNNER_TEMP/icon-assets.json"
          # Every layer of the Icon Composer file must be compiled in, named after its image or layer.
          if ! jq -e --slurpfile icon "$icon" '
            . as $assets
            | any($assets[]; .Name == "Icon" and .AssetType == "IconImageStack")
            and all($icon[0].groups[].layers[];
              (.["image-name"] | sub("\\.[^.]*$"; "")) as $image
              | .name as $layer
              | any($assets[]; .AssetType == "Image"
                  and (.Name == "Icon_Assets/\($image)" or .Name == "Icon_Assets/\($layer)")))
          ' "$RUNNER_TEMP/icon-assets.json"; then
            jq -c '[.[] | {Name, AssetType}]' "$RUNNER_TEMP/icon-assets.json"
            exit 1
          fi
          iconutil -c iconset "$app/Contents/Resources/icon.icns" -o "$RUNNER_TEMP/fallback.iconset"
          sips -s format png "$RUNNER_TEMP/fallback.iconset/icon_128x128@2x.png" --out "$RUNNER_TEMP/fallback-decoded.png"
          test -s "$RUNNER_TEMP/fallback-decoded.png"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist")" = Icon
          echo "SUPERBOT_E2E_EXECUTABLE=out/mac-arm64/$product.app/Contents/MacOS/$product" >> "$GITHUB_ENV"
        env:
          SUPERBOT_ALLOW_DEV_SECRETS: "1"
      - name: Capture packaged macOS setup window and Dock
        run: >-
          pnpm --filter @rakazo/desktop exec playwright test
          --config e2e/playwright.config.ts setup.spec.ts
          --grep "setup offers this computer first, with a Superbot server as the other choice"
      - name: Upload native macOS setup screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-macos-screenshot
          path: |
            apps/desktop/e2e/screenshots/08-setup-macos-native-controls.png
            apps/desktop/e2e/screenshots/09-macos-dock.png
          if-no-files-found: error
          retention-days: 1
