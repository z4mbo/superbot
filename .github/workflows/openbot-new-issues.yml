name: Notify OpenBot of new issues
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      OPENBOT_URL: https://signal.openbot.run/v1/webhooks/b5739738-39ae-47b3-a8ef-1bbbb5a10405
      OPENBOT_SECRET: ${{ secrets.OPENBOT_ISSUE_WEBHOOK_SECRET }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Send signed issue reference
        shell: bash
        run: |
          node <<'NODE'
          const { createHmac } = require('node:crypto');

          async function main() {
            const { OPENBOT_URL, OPENBOT_SECRET, GITHUB_REPOSITORY,
              GITHUB_REPOSITORY_ID, GITHUB_RUN_ID, ISSUE_NUMBER } = process.env;
            const issueNumber = Number(ISSUE_NUMBER);
            if (!OPENBOT_SECRET) throw new Error('Configure OPENBOT_ISSUE_WEBHOOK_SECRET in this repository.');
            if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) throw new Error('Invalid issue number.');

            const deliveryId = `github.${GITHUB_REPOSITORY_ID}.${GITHUB_RUN_ID}`;
            const body = JSON.stringify({
              type: 'github.issue.opened',
              data: { repository: GITHUB_REPOSITORY, issueNumber },
            });

            for (let attempt = 0; attempt < 4; attempt++) {
              const timestamp = String(Math.floor(Date.now() / 1000));
              const signature = createHmac('sha256', OPENBOT_SECRET)
                .update(`${timestamp}.${deliveryId}.${body}`).digest('hex');
              const response = await fetch(OPENBOT_URL, {
                method: 'POST',
                redirect: 'error',
                signal: AbortSignal.timeout(15000),
                headers: {
                  'Content-Type': 'application/json',
                  'x-openbot-timestamp': timestamp,
                  'x-openbot-delivery-id': deliveryId,
                  'x-openbot-signature': `sha256=${signature}`,
                },
                body,
              }).catch(() => null);

              if (response?.status === 200 || response?.status === 202) return;
              const retryable = !response || response.status === 429 || response.status >= 500;
              if (!retryable || attempt === 3) {
                throw new Error(`OpenBot delivery failed (${response?.status ?? 'network error'}).`);
              }
              await new Promise(resolve => setTimeout(resolve, 1000 * 2 ** attempt));
            }
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
