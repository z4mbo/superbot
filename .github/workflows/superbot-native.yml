name: Superbot native

on:
  push:
    branches: ["**"]
    paths: &native-paths
      - ".github/workflows/superbot-native.yml"
      - "native/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/web/public/service-logos/**"
      - "packages/core/src/models/model-marks.ts"
      - "examples/plugins/t3-coding/manifest.json"
      - "examples/plugins/kcal-diary/plugin.json"
      - "examples/plugins/marketplace-unit-converter/manifest.json"
      - "examples/plugins/marketplace-unit-converter/server.ts"
      - "examples/plugins/marketplace-unit-converter/temperature.html"
  pull_request:
    paths: *native-paths

permissions:
  contents: read

concurrency:
  group: superbot-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  native:
    name: Native Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2022]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --component rustfmt
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake libclang-dev perl pkg-config \
            libdbus-1-dev libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev \
            libxext-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev libxrender-dev
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: superbot-cargo-v1-${{ matrix.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Build the workspace
        if: runner.os == 'Linux'
        run: cargo build --locked --workspace
      - name: Test the workspace
        if: runner.os == 'Linux'
        run: cargo test --locked --workspace
      - name: Build desktop and CLI
        if: runner.os != 'Linux'
        run: cargo build --locked -p superbot-desktop -p superbot-cli
