[package]
name = "superbot-avatars"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bot avatars for the native Superbot apps: the built-in face, or a local avatar pack the person installs on their own computer."

[dependencies]
gpui-kit = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
v8 = { version = "152.2.0", optional = true }

[features]
local-engine = ["dep:v8"]
