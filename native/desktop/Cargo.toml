[package]
name = "superbot-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "superbot-desktop"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures-util = "0.3"
gpui-kit = "0.10.0"
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
superbot-avatars = { path = "../avatars", features = ["local-engine"] }
superbot-client = { path = "../client" }
superbot-features = { path = "../features" }
superbot-t3-inbox = { path = "../t3-inbox" }
superbot-workspace-panel = { path = "../workspace-panel" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry = { version = "0.57.3", default-features = false }
