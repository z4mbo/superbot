[package]
name = "superbot-plugin-kit"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "superbot-plugin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
superbot-client = { path = "../client" }
superbot-features = { path = "../features" }
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
tempfile = "3"
