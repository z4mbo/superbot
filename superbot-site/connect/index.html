<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connect to your server · Superbot</title>
  <meta name="description" content="Open the Superbot server you run.">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="preload" href="../assets/fonts/Geist-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/site.js"></script>
  <script type="module" src="../assets/connect.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="bar">
      <a class="brand" href="../"><img src="../assets/logo.svg" alt="" width="28" height="28">Superbot</a>
      <nav class="nav" aria-label="Main">
        <a href="../docs/">Docs</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Change theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 18a6 6 0 0 0 0-12v12z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="connect">
    <h1>Connect to your server</h1>
    <p class="lede">Your Superbot server must be running and reachable from this device, directly or over a private network such as Tailscale. This site never stores or sends the address.</p>
    <form data-connect novalidate>
      <label for="server">Server address</label>
      <input id="server" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="superbot.example.com" data-error="server-error" required>
      <p id="server-error" class="field-error" hidden></p>
      <button class="btn btn-primary" type="submit">Connect</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="bar">
      <span>Superbot. Open source.</span>
      <nav aria-label="Footer"><a href="../">Home</a><a href="../docs/">Docs</a><a href="../NOTICE.txt">Notices</a></nav>
    </div>
  </footer>
</body>
</html>
